name: Publish @use-nyte/eslint-config Package

on:
    push:
        tags:
            - v*

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                version: 10.33.2
            - uses: actions/setup-node@v6
              with:
                node-version: 24.15.0
                cache: pnpm
            - run: pnpm install --frozen-lockfile

    publish-gpr:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                version: 10.33.2
            - uses: actions/setup-node@v6
              with:
                node-version: 24.15.0
                registry-url: https://npm.pkg.github.com/
                cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm publish
              env:
                NODE_AUTH_TOKEN: ${{secrets.BOT_TOKEN}}
            - run: gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes --latest
              env:
                GH_TOKEN: ${{github.token}}
                TAG_NAME: ${{github.ref_name}}
