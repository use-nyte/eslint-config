name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Node CI
    uses: use-nyte/.github/.github/workflows/ci-node.yml@v1.2.0
    with:
      run-build: true
      run-tests: true
      run-typecheck: false
      run-lint: true
      run-format: true

  release:
    name: Release Node.js Package
    if: github.event_name == 'push'
    needs: ci
    uses: use-nyte/.github/.github/workflows/release-node-pkg.yml@v1.2.0
    permissions:
      contents: read
      packages: write
    secrets:
      NYTE_AUTOMATION_PRIVATE_KEY: ${{ secrets.NYTE_AUTOMATION_PRIVATE_KEY }}
